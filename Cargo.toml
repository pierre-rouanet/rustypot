[package]
name = "rustypot"
version = "1.13.1"
edition = "2021"
license = "Apache-2.0"
authors = ["Pollen Robotics"]
description = "Package to communicate with Dynamixel motors."
homepage = "https://www.pollen-robotics.com"
repository = "https://github.com/pollen-robotics/rustypot"
readme = "README.md"
# Built on its own, for the RP2040; see its README.
exclude = ["examples/embassy-rp2040"]
keywords = ["robotics", "dynamixel", "feetech"]
categories = ["science::robotics"]

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["std"]
# The blocking API: serial ports, the per-servo controllers, `Bus`, scanning. Without it
# the crate is `no_std` (it still needs `alloc`).
std = ["dep:serialport", "dep:clap"]
# The async API (`rustypot::asynch` and each servo's `asynch` module). Works without
# `std`, e.g. on embassy.
async = ["dep:embedded-io", "dep:embedded-io-async", "dep:embedded-hal", "dep:embedded-hal-async", "dep:embassy-futures"]
python = ["std", "dep:pyo3", "dep:pyo3-log", "dep:pyo3-stub-gen", "dep:env_logger"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
log = { version = "0.4.17", default-features = false }
paste = "1.0.10"
serialport = { version = "4.2.0", default-features = false, optional = true }
clap = { version = "4.0.32", features = ["derive"], optional = true }
embedded-io = { version = "0.7", optional = true }
embedded-io-async = { version = "0.7", optional = true }
embedded-hal = { version = "1.0", optional = true }
embedded-hal-async = { version = "1.0", optional = true }
embassy-futures = { version = "0.1.2", optional = true }
# pyo3 bumped to 0.29.0 for RUSTSEC-2026-0176 (out-of-bounds read in nth/nth_back
# for PyList/PyTuple iterators); the fix is only available in >=0.29.0.
# pyo3-stub-gen 0.23.0 is the first release compatible with pyo3 0.29.
pyo3 = { version = "=0.29.0", optional = true, features = ["multiple-pymethods"] }
pyo3-log = { version = ">=0.13.4", optional = true }
pyo3-stub-gen = { version = "=0.23.0", optional = true }
env_logger = { version = "0.10.0", optional = true }

[dev-dependencies]
clap = { version = "4.0.32", features = ["derive"] }
env_logger = "0.10.0"
log = "0.4.17"
signal-hook = "0.3.4"

[[bin]]
name = "stub_gen"
required-features = ["python"]

[[bin]]
name = "scan"
required-features = ["std"]

[package.metadata.docs.rs]
# Document the async API too (not `python`, which needs a Python toolchain).
features = ["async"]
